[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
torch = [
    "torch>=2.3",
    "torchvision>=0.18",
]
llm = [
    "anthropic>=0.39",
    "openai>=1.50",
]
